name: Auto-merge Dependabot

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if gh pr diff "${PR_URL}" --name-only | grep -q '^.github/workflows/'; then
            echo 'Dependabot changes to GitHub Actions workflows require manual merge.'
            exit 0
          fi
          gh pr merge "${PR_URL}" --auto --squash --delete-branch
